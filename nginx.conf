nginx_user=www-data
worker_processes=auto
error_log=/var/log/nginx/error.log warn
pid=/var/run/nginx.pid
events{
  worker_connections=4096
}
http{
  include /etc/nginx/mime.types
  default_type application/octet-stream
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"'
  access_log /var/log/nginx/access.log main
  sendfile on
  tcp_nopush on
  tcp_nodelay on
  keepalive_timeout 65
  types_hash_max_size 2048
  server_tokens off
  client_max_body_size 10M
  gzip on
  gzip_vary on
  gzip_proxied any
  gzip_comp_level 6
  gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss
  ssl_session_cache shared:SSL:10m
  ssl_session_timeout 10m
  ssl_protocols TLSv1.2 TLSv1.3
  ssl_ciphers HIGH:!aNULL:!MD5
  ssl_prefer_server_ciphers on
  upstream secure_messenger{
    server backend:3000 max_fails=3 fail_timeout=30s
  }
  server{
    listen 80
    server_name api.securemessenger.app
    return 301 https://$server_name$request_uri
  }
  server{
    listen 443 ssl http2
    server_name api.securemessenger.app
    ssl_certificate /etc/letsencrypt/live/api.securemessenger.app/fullchain.pem
    ssl_certificate_key /etc/letsencrypt/live/api.securemessenger.app/privkey.pem
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always
    add_header X-Content-Type-Options "nosniff" always
    add_header X-Frame-Options "DENY" always
    add_header X-XSS-Protection "1; mode=block" always
    add_header Referrer-Policy "strict-origin-when-cross-origin" always
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always
    location / {
      proxy_pass http://secure_messenger
      proxy_set_header Host $host
      proxy_set_header X-Real-IP $remote_addr
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for
      proxy_set_header X-Forwarded-Proto $scheme
      proxy_connect_timeout 60s
      proxy_send_timeout 60s
      proxy_read_timeout 60s
    }
    location /socket.io {
      proxy_pass http://secure_messenger
      proxy_http_version 1.1
      proxy_set_header Upgrade $http_upgrade
      proxy_set_header Connection "upgrade"
      proxy_set_header Host $host
      proxy_set_header X-Real-IP $remote_addr
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for
    }
  }
}
