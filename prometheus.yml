global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - localhost:9093

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "secure-messenger"
    static_configs:
      - targets: ["localhost:9090"]
    metrics_path: "/metrics"
    scrape_interval: 10s

  - job_name: "postgres"
    static_configs:
      - targets: ["localhost:5432"]
    scrape_interval: 15s

  - job_name: "redis"
    static_configs:
      - targets: ["localhost:6379"]
    scrape_interval: 15s
